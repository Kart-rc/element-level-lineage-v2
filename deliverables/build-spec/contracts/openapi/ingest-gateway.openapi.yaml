openapi: 3.1.0
info:
  title: Throughline Ingest Gateway API
  version: 1.0.0
  description: >
    The single validated entry to the graph core (component B7). Every signal — including the
    platform's own extractors — submits canonical envelopes here; no signal bypasses validation.
    x-source: deliverables/aws-lineage-collection-plan/04-collection-workflow-spec.md §5.3
    (validation pipeline order), 02-aws-architecture.md §3, lineage-collection-assessment.md §2
    (gateway rules: authenticate workload identity, reject value-bearing fields, validate versions,
    record raw event, ack only after durable acceptance).
servers:
  - url: /v1
security:
  - workloadIam: []
paths:
  /observations:
    post:
      operationId: submitObservations
      summary: Submit a batch of canonical observation envelopes
      description: >
        Validation order per workflow-spec §5.3: authenticate workload identity → envelope JSON Schema
        for schemaVersion → payload schema for (schemaVersion, signal) → assertion-constraint check →
        metadata-only boundary (reject value-bearing fields) → durable accept (Firehose archive +
        graph-core handoff) → ack. Consumers are idempotent; replay converges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelopes]
              properties:
                envelopes:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/ObservationEnvelope'
      responses:
        '200':
          description: Per-envelope disposition. 200 means durably accepted OR itemized rejection — never partial silence.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, rejected]
                properties:
                  accepted:
                    type: array
                    items: {type: string, description: eventId}
                  rejected:
                    type: array
                    items:
                      type: object
                      required: [eventId, reason]
                      properties:
                        eventId: {type: string}
                        reason:
                          type: string
                          enum:
                            - schema-version-unknown
                            - payload-schema-violation
                            - assertion-violation
                            - value-bearing-field
                            - identity-unauthenticated
                            - environment-missing
                        detail: {type: string}
                        dlq: {type: boolean, description: 'true when the envelope was quarantined to the DLQ with this reason'}
        '401': {description: Workload identity not authenticated}
        '503': {description: Durable acceptance unavailable — caller must retry with the same idempotencyKeys; producers buffer in SQS (08 §4)}
  /schemas/{schemaVersion}/{signal}:
    get:
      operationId: getPayloadSchema
      summary: Fetch the pinned payload schema for (schemaVersion, signal)
      description: Serves the git-versioned registry published to S3 (B6). Validators pin versions — fail-static, not fail-open, when the registry is unreachable.
      parameters:
        - {name: schemaVersion, in: path, required: true, schema: {type: string}}
        - {name: signal, in: path, required: true, schema: {type: string, enum: [sca, llm, spark-ol, airflow-ol, warehouse, cloudwatch-agg, otel-agg, sidecar-test, registry, declared]}}
      responses:
        '200':
          description: JSON Schema document
          content:
            application/schema+json:
              schema: {type: object}
        '404': {description: Unknown version/signal pair}
components:
  securitySchemes:
    workloadIam:
      type: http
      scheme: aws4-hmac-sha256
      description: SigV4 workload identity — no human principals on this surface
  schemas:
    ObservationEnvelope:
      description: Normative shape in ../schemas/observation-envelope.schema.json (including per-signal assertion constraints)
      type: object
